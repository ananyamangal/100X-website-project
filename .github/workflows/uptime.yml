# Uptime + usage alerts for www.100xcircle.com, run OUTSIDE Vercel so a paused or broken
# deployment is still reported. Setup, secret names and the simulate-down test: README.md.
name: Uptime alerts

on:
  schedule:
    - cron: "*/10 * * * *"   # site check every 10 minutes
    - cron: "30 3 * * *"     # daily Vercel usage check, 09:00 IST
  workflow_dispatch:
    inputs:
      simulate_down:
        description: "Send a [TEST] DOWN alert without touching the stored state"
        type: boolean
        default: false
      run_usage:
        description: "Also run the daily Vercel usage check now"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: uptime-alerts
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://www.100xcircle.com' }}
  VERCEL_DASHBOARD_URL: ${{ vars.VERCEL_DASHBOARD_URL || 'https://vercel.com/dashboard' }}

jobs:
  check:
    name: Site check
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/uptime
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # State (UP/DOWN, first-seen, last alert) lives in the Actions cache, never in the site DB.
      # Each run saves under a new key; restore-keys picks the most recent one.
      - uses: actions/cache/restore@v4
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-
      - name: Install mail transport (only dependency)
        run: npm install --no-save --no-audit --no-fund --no-package-lock nodemailer@6.9.16
      - name: Check the site and alert
        run: node scripts/uptime/check.mjs
        env:
          SIMULATE_DOWN: ${{ inputs.simulate_down == true && 'true' || '' }}
          UPTIME_TARGETS: ${{ vars.UPTIME_TARGETS }}
          ALERT_ALWAYS_FALLBACK: ${{ vars.ALERT_ALWAYS_FALLBACK }}
          # e-mail (one of: SMTP, Resend, Brevo, SendGrid)
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          # WhatsApp (one of: Meta Cloud API, Twilio)
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANG: ${{ secrets.WHATSAPP_TEMPLATE_LANG }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_CONTENT_SID: ${{ secrets.TWILIO_CONTENT_SID }}
          # free fallbacks
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}

  usage:
    name: Vercel usage check
    if: github.event.schedule == '30 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.run_usage == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/uptime
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: .uptime-state
          key: uptime-usage-${{ github.run_id }}
          restore-keys: uptime-usage-
      - run: npm install --no-save --no-audit --no-fund --no-package-lock nodemailer@6.9.16
      - name: Read Vercel usage and warn at 70% / 90%
        run: node scripts/uptime/usage.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_USAGE_URL: ${{ vars.VERCEL_USAGE_URL }}
          USAGE_LIMIT_CPU_HOURS: ${{ vars.USAGE_LIMIT_CPU_HOURS }}
          USAGE_LIMIT_INVOCATIONS: ${{ vars.USAGE_LIMIT_INVOCATIONS }}
          ALERT_ALWAYS_FALLBACK: ${{ vars.ALERT_ALWAYS_FALLBACK }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANG: ${{ secrets.WHATSAPP_TEMPLATE_LANG }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_CONTENT_SID: ${{ secrets.TWILIO_CONTENT_SID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .uptime-state
          key: uptime-usage-${{ github.run_id }}
